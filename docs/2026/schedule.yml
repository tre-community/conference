      - time: 13:15 - 14:15
        type: plenary
        sessions:
          - title: "Plenary: DEA, UK Stats Authority and Accreditation of TREs"
            description: |
              How does an organisation become trusted to process sensitive data under the Digital Economy Act? This session will demystify UKSA Processor Accreditation, explain what assessors look for, share common challenges, and discuss how accreditation can help strengthen trust, governance and security across the UK's TRE ecosystem.

              Audience:
                - TRE service managers and operational leads
                - Secure Data Environment (SDE) leads
                - TRE infrastructure and platform developers
                - Governance, compliance and information governance professionals
                - Data custodians and data access teams
                - Security architects and cyber security professionals
                - Researchers involved in TRE design and delivery
                - Public sector organisations providing access to sensitive data
                - Organisations considering applying for DEA Processor Accreditation
                - Policy and assurance professionals involved in trusted research infrastructure
            room: Orchardfield
            speakers:
              - name: Rhys Nadin
                affiliation: UK Statistics Authority
      - time: 14:15 - 14:30
        type: break
        sessions:
          - title: Refreshments
      - time: 14:30 - 16:00
        sessions:
          - title: "Non-Technical Problems: Overcoming the Practical Challenges of Data Federation"
            description: |
              This session will include a presentation on research conducted to identify key themes and challenges associated with the establishment of federated networks, and a practical reflection on how they can manifest in federated research projects. It will conclude with a participatory exercise that will allow the audience to contribute their own views and experiences.

              Expected audience type:
                - People building tools, platforms, frameworks, infrastructure to enable federation
                - People operating TREs, data platforms, or secure research infrastructures
                - People coordinating governance, policy, and standards for federation
                - People funding, supporting, or commissioning federated research
                - People conducting research that relies on cross-TRE data access
            room: Orchardfield
            # speakers:
            #   - name:
            #     affiliation:
          - title: "Governance in Practice for Sensitive Data Access: Lessons from Safe Text and Synthetic Data Communities"
            description: |
              This session explores how TREs are evolving to support next-generation sensitive data and AI research. Drawing on experiences from the SAFETEXT and Synthetic Data communities, and Next-Gen Catalyst projects (STAR-TRE, FORTRESS-TeHR), we examine how governance balances privacy, security, utility, and public trust across real-world and synthetic structured and free-text data.

              Audience: This session will include introductory talks and both expert panel and participant group discussions. We expect audience from the public and across TRE roles, including TRE governance and project support, as well as TRE infrastructure and service development.
            room: Sky Suite
            # speakers:
            #   - name:
            #     affiliation:
