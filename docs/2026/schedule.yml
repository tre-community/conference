        type: plenary
        sessions:
          - title: Lightning Talks / Roundup of the day
      - time: 17:30 - 19:00
        type: social
        sessions:
          - title: RDS Sponsored Drinks & Stand Up Dinner Reception
            room: "External venue: Edinburgh Futures Institute"

  - date: 2026-11-17
    title: Tuesday 17 November 2026
    tracks:
      - Main Room Orchardfield (Ground floor)
      - Sky suite (5th floor)
    slots:
      - time: 09:00 - 09:30
        type: break
        sessions:
          - title: Arrival & Breakfast - sponsored by UKDS
            room: Ground floor lobby / Rowan
      - time: 09:30 - 09:45
        type: plenary
        sessions:
          - title: "Welcome back & Roundup of Day 1"
            room: Orchardfield
      - time: 09:45 - 10:45
        type: plenary
        sessions:
          - title: "Plenary: DARE & TREvolution"
            description: |
              Jointly hosted by DARE and TREvolution, we will explore ideas for the future development of the UK Trusted Research Environment (TRE) ecosystem. Through audience engagement and discussion, participants will examine approaches to federation and relevant personas, sustainability, community needs, emerging challenges, and an opportunity to provide views on how well we are delivering so far thus helping to inform future directions for UK-wide TRE infrastructure and services.

              Audience:
                - TRE infrastructure support and development teams
                - TRE service managers and operators
                - Governance, information governance and policy leads
                - Research support and project delivery staff
                - Researchers and data users
                - Funders, programme leads and strategic decision-makers
            room: Orchardfield
            # speakers:
            #   - name:
            #     affiliation:
      - time: 10:45 - 11:00
        type: break
        sessions:
          - title: Refreshments
            room: Ground floor lobby
      - time: 11:00 - 12:30
        sessions:
          - title: Shapes and Patterns of Federation
            description: |
              This session explores how to integrate the Federated Research Patterns framework with different models of federation infrastructure. Resolving the disparity between data requirements and infrastructure opportunities will help define what's acceptable from both perspectives. Brief presentations, breakout groups, and interactive discussion will support enumerating the various shapes of federation.

              Expected audience type:
                - People building tools, platforms, frameworks, infrastructure to enable federation
                - People operating TREs, data platforms, or secure research infrastructures
                - People coordinating governance, policy, and standards for federation
                - People funding, supporting, or commissioning federated research
                - People conducting research that relies on cross-TRE data access
            room: Orchardfield
            # speakers:
            #   - name:
            #     affiliation:
          - title: Writing, Agreeing and Living by a Rulebook in a Federated Ecosystem
            description: |
              Federated research relies on trust, shared governance and clear ways of working. Join three Trusted Research Environment research projects as they briefly showcase their work before facilitating an interactive workshop where participants will help co-create the foundations of a practical rulebook for collaboration, information governance and trusted data sharing.

              Expected audience: Everyone welcome
            room: Sky Suite
            # speakers:
            #   - name:
            #     affiliation:
      - time: 12:30 - 13:30
        type: break
        sessions:
          - title: Lunch
            room: Ground floor lobby
      - time: 13:30 - 15:00
        type: plenary
        sessions:
          - title: "Plenary: Earning Trust, Not Assuming It (PIE session): Commercialisation and public acceptability"
            description: |
              This session will explore how to support trustworthy commercial access to Trusted Research Environments as part of research projects for the public good. You will hear about current access models, governance and stakeholder expectations, and discuss how data protection, intellectual property and public benefit can be safeguarded while enabling impactful research that improves lives.

              Audience: Anybody with an interest in trustworthy commercial access to TREs. This includes but is not limited to data custodians, industry representatives, information governance professionals, public engagement professionals and members of the public.
            room: Orchardfield
            # speakers:
            #   - name:
            #     affiliation:
      - time: 15:00 - 15:15
        type: break
        sessions:
          - title: Refreshments
            room: Ground floor
      - time: 15:15 - 16:45
        sessions:
          - title: "Harmonising policies on decision making on what can and cannot be used in a TRE"
            description: |
              Presentations and breakout groups will discuss:
              Public involvement and engagement in decision making in TREs
              How do we decide on what linkage methods are supported in each TRE and across TREs?
              How do we decide what containers can be imported into each TRE and across TREs?

                - how to translate the risks into decisions?
                - who are the stakeholders in these decisions?
                - how do we harmonise decisions across TREs?
                - how to communicate the decision-making process and outcomes in a way that's accessible for the public?

              We see more requests for studies that require data linked across two or more TREs and that require bespoke software. In this session we will use breakout groups to collect proposals on how we translate the risks of these requests into decisions, harmonise decisions across TREs and communicate the decision-making process in a way that's accessible for the public.

              Audience: Public, TRE infrastructure development, TRE service managers, TRE project support, governance, data matching and linkage providers.
            room: Orchardfield
            # speakers:
            #   - name:
            #     affiliation:
          - title: How do we FAIRify data that can't be shared? Metadata approaches for TREs
            description: |
              In this session, presenters will share tools for gathering, discovering and sharing metadata in the context of TREs through the MetadataWorks platform and RO-Crates. There will be an opportunity for group discussion about the tools and about other aspects of TRE metadata such as quality and impact.

              Audience: TRE infrastructure support/development, TRE service managers, analysts
            room: Sky Suite
            # speakers:
            #   - name:
            #     affiliation:
