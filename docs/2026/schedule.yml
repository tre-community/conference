  - date: 2026-11-18
    title: Wednesday 18 November 2026
    tracks:
      - Main Room Orchardfield (Ground floor)
      - Sky suite (5th floor)
      - Hawthorn (Basement)
    slots:
      - time: 09:00 - 09:30
        type: break
        sessions:
          - title: Arrival & Breakfast - Sponsored by UKDS
            room: Ground floor lobby
      - time: 09:30 - 11:00
        sessions:
          - title: International Access - principles of safe access
            description: |
              Using the case of international access to sensitive data, this interactive session will workshop how organisations can agree principles for equivalency in information governance and move towards safe federation.

              Outputs: initial set of principles for safe international access and comparison with current enactment in the European Health Data Space.

              Audience: governance professionals,TRE providers and service managers, TRE project support
            room: Orchardfield
            # speakers:
            #   - name:
            #     affiliation:
          - title: "Building Capacity and Driving Impact in Administrative Data Research: Practical Lessons from Coordinated Support and Infrastructure"
            description: |
              Trusted Research Environments and administrative data create major opportunities for policy-relevant research, yet many researchers face challenges accessing data, developing proposals, and achieving impact. Drawing on ADR UK's ecosystem, the session will combine insights from support models with co-design activities to identify approaches for enhancing research capacity and impact.

              Audience: TRE providers and data infrastructure teams; funders and programme managers; research development professionals; researchers from all career stages using administrative data.
            room: Sky Suite
            # speakers:
            #   - name:
            #     affiliation:
          - title: TEEs for TREs
            description: |
              Trusted Execution Environments (TEEs) keep processes confidential by encrypting data while in use,removing the need to trust the host computer.

              Through a mix of presentation and discussion, we will explore when TEEs can add value to TREs, and how they can open the door to new models of TREs.
            # speakers:
            #   - name:
            #     affiliation:
            room: Hawthorn
