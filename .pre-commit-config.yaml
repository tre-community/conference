ci:
  # pre-commit.ci will autoamtically update hooks every month
  autoupdate_schedule: monthly

repos:
  # Autoformat: js, markdown, yaml
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier

  # https://github.com/astral-sh/ruff-pre-commit
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
